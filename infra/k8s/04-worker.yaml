# Stateless queue worker. Consumes the Kafka bus (shared consumer group), so
# adding replicas linearly increases run throughput. This is the Deployment the
# HPA scales under load (see 06-hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentic
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: agentic-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "service.worker"]
          envFrom:
            - configMapRef: {name: agent-config}
            - secretRef: {name: agent-secrets}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
