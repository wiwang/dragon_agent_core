apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: agentic-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "service.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: agent-config}
            - secretRef: {name: agent-secrets}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
