[project]
name = "agentic-agent"
version = "0.1.0"
description = "Mini-LangGraph: a stateful, graph-based agent runtime built from scratch, extended toward production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Real LLM provider. Core runs on MockLLM without this.
llm = [
    "anthropic>=0.39",
]
# API service + UI (Phase 3).
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "gradio>=4.40",
]
# Production data infra (Phase 4).
infra = [
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.10",
    "aiokafka>=0.11",
]
# Observability + eval tracking (Phase 5).
obs = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "mlflow>=2.14",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_lang", "src/service", "src/ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true
